[package]
name = "carrac-tui"
version = "1.0.0-rc.1"
edition = "2024"
description = "Terminal market cockpit for Carrac.cc — candlestick charts, positions, plays, alerts and AI workflows in your terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Carrac-cc/carrac-tui"
homepage = "https://carrac.cc"
keywords = ["tui", "trading", "charts", "terminal", "candlestick"]
categories = ["command-line-utilities", "visualization"]
publish = false

# Keep internal docs/scripts out of any future crates.io package (publishing is
# disabled today; this guards the file set if that ever changes).
exclude = [
    "CLAUDE.md", "AGENTS.md", "PLAN.md", "MVP.md", "BENCHMARK.md",
    "CONTINUATION.md", "SPRINT-LOG.md", "ROADMAP*.md",
    "scripts/", ".claude/", "tests/oss_hygiene.rs",
]

# `publish = false` would otherwise hide this binary from `dist`; opt it in explicitly.
[package.metadata.dist]
dist = true

[[bin]]
name = "carrac"
path = "src/main.rs"

[lib]
name = "carrac_tui"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros", "signal", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
crossterm = "0.29"
ratatui = { version = "=0.30.0", features = ["crossterm", "unstable-rendered-line-info"] }
# PNG chart rendering (--png flag on `carrac chart`)
# `ab_glyph` (not `ttf`) keeps text rendering pure-Rust with an embedded font
# (see assets/fonts/) — no system fontconfig/font-kit link, so the binary is
# self-contained on every platform and the static musl build works.
plotters = { version = "=0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "full_palette", "candlestick", "ab_glyph"] }
image = { version = "0.25", default-features = false, features = ["png"] }
viuer = { version = "=0.11.0", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
